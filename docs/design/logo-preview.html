<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stacks — Logo v2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Libre+Baskerville&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #E8E3DC;
      font-family: 'Libre Baskerville', Georgia, serif;
      padding: 48px 32px;
      min-height: 100vh;
    }

    h2 {
      font-family: 'Libre Baskerville', serif;
      font-size: 11px;
      letter-spacing: 3px;
      color: #8A7B68;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .variant { margin-bottom: 48px; }

    .logo-wrap {
      display: inline-block;
      padding: 32px 40px;
      border-radius: 4px;
    }

    .light { background: #F7F4EF; }
    .dark  { background: #1C2A3A; }
    .icon-only { padding: 24px; }

    .small-wrap {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 24px 0;
    }
    .small-wrap span {
      font-size: 11px;
      letter-spacing: 2px;
      color: #8A7B68;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- ── Full lockup, light ── -->
  <div class="variant">
    <h2>Full lockup — light</h2>
    <div class="logo-wrap light">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" width="480" height="160">

        <!-- Depth shadow -->
        <rect x="32" y="42" width="72" height="76" rx="3" fill="#D6C9B0" opacity="0.4"/>

        <!-- Book 5 — widest, bottom, ink navy. Indicator dots at right end -->
        <rect x="28" y="106" width="76" height="11" rx="2" fill="#2C3E5A"/>
        <!-- Three indicator dots, right-aligned, evenly spaced -->
        <!-- Active green -->
        <circle cx="85" cy="111.5" r="2.2" fill="#5DBE7E"/>
        <!-- Amber / idle -->
        <circle cx="78" cy="111.5" r="2.2" fill="#C99A4A"/>
        <!-- Off / dim -->
        <circle cx="71" cy="111.5" r="2.2" fill="#3A5068"/>

        <!-- Book 4 — forest green, plain -->
        <rect x="30" y="93" width="68" height="10" rx="2" fill="#4A6741"/>

        <!-- Book 3 — brass accent, narrow. Dot matrix row across face -->
        <rect x="33" y="82" width="44" height="9" rx="2" fill="#B5843A"/>
        <!-- 8 evenly spaced dots, slightly inset from edges -->
        <circle cx="39"  cy="86.5" r="1.3" fill="#F7F4EF" opacity="0.55"/>
        <circle cx="44"  cy="86.5" r="1.3" fill="#F7F4EF" opacity="0.55"/>
        <circle cx="49"  cy="86.5" r="1.3" fill="#F7F4EF" opacity="0.55"/>
        <circle cx="54"  cy="86.5" r="1.3" fill="#F7F4EF" opacity="0.9"/>
        <circle cx="59"  cy="86.5" r="1.3" fill="#F7F4EF" opacity="0.9"/>
        <circle cx="64"  cy="86.5" r="1.3" fill="#F7F4EF" opacity="0.55"/>
        <circle cx="69"  cy="86.5" r="1.3" fill="#F7F4EF" opacity="0.3"/>
        <circle cx="74"  cy="86.5" r="1.3" fill="#F7F4EF" opacity="0.3"/>

        <!-- Book 2 — ink navy, plain -->
        <rect x="30" y="70" width="62" height="10" rx="2" fill="#2C3E5A"/>

        <!-- Book 1 — slate, top, plain -->
        <rect x="28" y="58" width="70" height="10" rx="2" fill="#5C7A8C"/>

        <!-- Subtle spine divider lines -->
        <line x1="90" y1="58"  x2="90" y2="68"  stroke="#F7F4EF" stroke-width="0.8" opacity="0.4"/>
        <line x1="84" y1="70"  x2="84" y2="80"  stroke="#F7F4EF" stroke-width="0.8" opacity="0.4"/>
        <line x1="69" y1="106" x2="69" y2="117" stroke="#F7F4EF" stroke-width="0.8" opacity="0.15"/>
        <line x1="80" y1="93"  x2="80" y2="103" stroke="#F7F4EF" stroke-width="0.8" opacity="0.4"/>
        <line x1="88" y1="106" x2="88" y2="117" stroke="#F7F4EF" stroke-width="0.8" opacity="0.15"/>

        <!-- Wordmark -->
        <text x="132" y="102"
          font-family="'Playfair Display', Georgia, serif"
          font-weight="600" font-size="58" letter-spacing="-1"
          fill="#2C3E5A">Stacks</text>

        <!-- Tagline -->
        <text x="134" y="124"
          font-family="'Libre Baskerville', Georgia, serif"
          font-size="11.5" letter-spacing="2.8"
          fill="#8A7B68">COURSE READING LISTS</text>

      </svg>
    </div>
  </div>

  <!-- ── Full lockup, dark ── -->
  <div class="variant">
    <h2>Full lockup — dark</h2>
    <div class="logo-wrap dark">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" width="480" height="160">

        <rect x="32" y="42" width="72" height="76" rx="3" fill="#3A5068" opacity="0.4"/>

        <!-- Book 5 — bottom, indicator dots -->
        <rect x="28" y="106" width="76" height="11" rx="2" fill="#7BA3C0"/>
        <circle cx="85" cy="111.5" r="2.2" fill="#5DBE7E"/>
        <circle cx="78" cy="111.5" r="2.2" fill="#C99A4A"/>
        <circle cx="71" cy="111.5" r="2.2" fill="#2C4A64"/>

        <!-- Book 4 -->
        <rect x="30" y="93"  width="68" height="10" rx="2" fill="#6A9460"/>

        <!-- Book 3 — brass, dot matrix -->
        <rect x="33" y="82"  width="44" height="9"  rx="2" fill="#C99A4A"/>
        <circle cx="39"  cy="86.5" r="1.3" fill="#1C2A3A" opacity="0.45"/>
        <circle cx="44"  cy="86.5" r="1.3" fill="#1C2A3A" opacity="0.45"/>
        <circle cx="49"  cy="86.5" r="1.3" fill="#1C2A3A" opacity="0.45"/>
        <circle cx="54"  cy="86.5" r="1.3" fill="#1C2A3A" opacity="0.8"/>
        <circle cx="59"  cy="86.5" r="1.3" fill="#1C2A3A" opacity="0.8"/>
        <circle cx="64"  cy="86.5" r="1.3" fill="#1C2A3A" opacity="0.45"/>
        <circle cx="69"  cy="86.5" r="1.3" fill="#1C2A3A" opacity="0.25"/>
        <circle cx="74"  cy="86.5" r="1.3" fill="#1C2A3A" opacity="0.25"/>

        <!-- Book 2 -->
        <rect x="30" y="70"  width="62" height="10" rx="2" fill="#7BA3C0"/>

        <!-- Book 1 -->
        <rect x="28" y="58"  width="70" height="10" rx="2" fill="#A8C4D4"/>

        <line x1="90" y1="58"  x2="90" y2="68"  stroke="#1C2A3A" stroke-width="0.8" opacity="0.5"/>
        <line x1="84" y1="70"  x2="84" y2="80"  stroke="#1C2A3A" stroke-width="0.8" opacity="0.5"/>
        <line x1="80" y1="93"  x2="80" y2="103" stroke="#1C2A3A" stroke-width="0.8" opacity="0.5"/>

        <text x="132" y="102"
          font-family="'Playfair Display', Georgia, serif"
          font-weight="600" font-size="58" letter-spacing="-1"
          fill="#EEE8DF">Stacks</text>

        <text x="134" y="124"
          font-family="'Libre Baskerville', Georgia, serif"
          font-size="11.5" letter-spacing="2.8"
          fill="#8A9BAA">COURSE READING LISTS</text>

      </svg>
    </div>
  </div>

  <!-- ── Icon only ── -->
  <div class="variant">
    <h2>Icon mark — light &amp; dark</h2>
    <div style="display:flex; gap: 24px; align-items: flex-start;">

      <div class="logo-wrap light icon-only">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
          <!-- Book 5 — indicator dots -->
          <rect x="12" y="54" width="56" height="10" rx="2" fill="#2C3E5A"/>
          <circle cx="59" cy="59" r="2" fill="#5DBE7E"/>
          <circle cx="53" cy="59" r="2" fill="#C99A4A"/>
          <circle cx="47" cy="59" r="2" fill="#3A5068"/>
          <!-- Book 4 -->
          <rect x="14" y="42" width="48" height="9"  rx="2" fill="#4A6741"/>
          <!-- Book 3 — dot matrix -->
          <rect x="17" y="32" width="30" height="8"  rx="2" fill="#B5843A"/>
          <circle cx="22" cy="36" r="1.1" fill="#F7F4EF" opacity="0.5"/>
          <circle cx="27" cy="36" r="1.1" fill="#F7F4EF" opacity="0.5"/>
          <circle cx="32" cy="36" r="1.1" fill="#F7F4EF" opacity="0.9"/>
          <circle cx="37" cy="36" r="1.1" fill="#F7F4EF" opacity="0.9"/>
          <circle cx="42" cy="36" r="1.1" fill="#F7F4EF" opacity="0.3"/>
          <!-- Book 2 -->
          <rect x="14" y="21" width="44" height="9"  rx="2" fill="#2C3E5A"/>
          <!-- Book 1 -->
          <rect x="12" y="10" width="52" height="9"  rx="2" fill="#5C7A8C"/>
        </svg>
      </div>

      <div class="logo-wrap icon-only" style="background:#1C2A3A;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
          <rect x="12" y="54" width="56" height="10" rx="2" fill="#7BA3C0"/>
          <circle cx="59" cy="59" r="2" fill="#5DBE7E"/>
          <circle cx="53" cy="59" r="2" fill="#C99A4A"/>
          <circle cx="47" cy="59" r="2" fill="#2C4A64"/>
          <rect x="14" y="42" width="48" height="9"  rx="2" fill="#6A9460"/>
          <rect x="17" y="32" width="30" height="8"  rx="2" fill="#C99A4A"/>
          <circle cx="22" cy="36" r="1.1" fill="#1C2A3A" opacity="0.4"/>
          <circle cx="27" cy="36" r="1.1" fill="#1C2A3A" opacity="0.4"/>
          <circle cx="32" cy="36" r="1.1" fill="#1C2A3A" opacity="0.8"/>
          <circle cx="37" cy="36" r="1.1" fill="#1C2A3A" opacity="0.8"/>
          <circle cx="42" cy="36" r="1.1" fill="#1C2A3A" opacity="0.25"/>
          <rect x="14" y="21" width="44" height="9"  rx="2" fill="#7BA3C0"/>
          <rect x="12" y="10" width="52" height="9"  rx="2" fill="#A8C4D4"/>
        </svg>
      </div>

    </div>
  </div>

  <!-- ── Small scale ── -->
  <div class="variant">
    <h2>Small scale</h2>
    <div class="small-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="32" height="32">
        <rect x="12" y="54" width="56" height="10" rx="2" fill="#2C3E5A"/>
        <circle cx="59" cy="59" r="2" fill="#5DBE7E"/>
        <circle cx="53" cy="59" r="2" fill="#C99A4A"/>
        <circle cx="47" cy="59" r="2" fill="#3A5068"/>
        <rect x="14" y="42" width="48" height="9"  rx="2" fill="#4A6741"/>
        <rect x="17" y="32" width="30" height="8"  rx="2" fill="#B5843A"/>
        <circle cx="22" cy="36" r="1.1" fill="#F7F4EF" opacity="0.5"/>
        <circle cx="27" cy="36" r="1.1" fill="#F7F4EF" opacity="0.5"/>
        <circle cx="32" cy="36" r="1.1" fill="#F7F4EF" opacity="0.9"/>
        <circle cx="37" cy="36" r="1.1" fill="#F7F4EF" opacity="0.9"/>
        <circle cx="42" cy="36" r="1.1" fill="#F7F4EF" opacity="0.3"/>
        <rect x="14" y="21" width="44" height="9"  rx="2" fill="#2C3E5A"/>
        <rect x="12" y="10" width="52" height="9"  rx="2" fill="#5C7A8C"/>
      </svg>
      <span>32px</span>

      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="20" height="20">
        <rect x="12" y="54" width="56" height="10" rx="2" fill="#2C3E5A"/>
        <circle cx="59" cy="59" r="2" fill="#5DBE7E"/>
        <circle cx="53" cy="59" r="2" fill="#C99A4A"/>
        <circle cx="47" cy="59" r="2" fill="#3A5068"/>
        <rect x="14" y="42" width="48" height="9"  rx="2" fill="#4A6741"/>
        <rect x="17" y="32" width="30" height="8"  rx="2" fill="#B5843A"/>
        <circle cx="27" cy="36" r="1.1" fill="#F7F4EF" opacity="0.5"/>
        <circle cx="32" cy="36" r="1.1" fill="#F7F4EF" opacity="0.9"/>
        <circle cx="37" cy="36" r="1.1" fill="#F7F4EF" opacity="0.9"/>
        <rect x="14" y="21" width="44" height="9"  rx="2" fill="#2C3E5A"/>
        <rect x="12" y="10" width="52" height="9"  rx="2" fill="#5C7A8C"/>
      </svg>
      <span>20px</span>
    </div>
  </div>

  <!-- ── Colour palette ── -->
  <div class="variant">
    <h2>Colour palette</h2>
    <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
      <div style="text-align:center;">
        <div style="width:56px;height:56px;border-radius:4px;background:#2C3E5A;"></div>
        <div style="font-size:10px;color:#8A7B68;margin-top:6px;letter-spacing:1px;">INK NAVY<br>#2C3E5A</div>
      </div>
      <div style="text-align:center;">
        <div style="width:56px;height:56px;border-radius:4px;background:#5C7A8C;"></div>
        <div style="font-size:10px;color:#8A7B68;margin-top:6px;letter-spacing:1px;">SLATE<br>#5C7A8C</div>
      </div>
      <div style="text-align:center;">
        <div style="width:56px;height:56px;border-radius:4px;background:#4A6741;"></div>
        <div style="font-size:10px;color:#8A7B68;margin-top:6px;letter-spacing:1px;">FOREST<br>#4A6741</div>
      </div>
      <div style="text-align:center;">
        <div style="width:56px;height:56px;border-radius:4px;background:#B5843A;"></div>
        <div style="font-size:10px;color:#8A7B68;margin-top:6px;letter-spacing:1px;">BRASS<br>#B5843A</div>
      </div>
      <div style="text-align:center;">
        <div style="width:56px;height:56px;border-radius:4px;background:#5DBE7E;"></div>
        <div style="font-size:10px;color:#8A7B68;margin-top:6px;letter-spacing:1px;">ACTIVE<br>#5DBE7E</div>
      </div>
      <div style="text-align:center;">
        <div style="width:56px;height:56px;border-radius:4px;background:#F7F4EF;border:1px solid #D6C9B0;"></div>
        <div style="font-size:10px;color:#8A7B68;margin-top:6px;letter-spacing:1px;">PARCHMENT<br>#F7F4EF</div>
      </div>
      <div style="text-align:center;">
        <div style="width:56px;height:56px;border-radius:4px;background:#1C2A3A;"></div>
        <div style="font-size:10px;color:#8A7B68;margin-top:6px;letter-spacing:1px;">DEEP NIGHT<br>#1C2A3A</div>
      </div>
    </div>
  </div>

</body>
</html>
