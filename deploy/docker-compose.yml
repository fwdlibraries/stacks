# Paths below are relative to this file (deploy/). Run from the repo root with:
#   docker compose --env-file .env -f deploy/docker-compose.yml up -d
name: stacks

services:
  app:
    image: ghcr.io/fwdlibraries/stacks/backend:${STACKS_VERSION:-latest}
    build:
      context: ../backend
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-stacks}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-stacks}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - stacks

  worker:
    image: ghcr.io/fwdlibraries/stacks/backend:${STACKS_VERSION:-latest}
    build:
      context: ../backend
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    restart: unless-stopped
    # The image's HEALTHCHECK probes the API on :8000, which the worker doesn't serve
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-stacks}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-stacks}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - stacks

  # Celery beat: schedules periodic tasks (the nightly catalogue sync) for the worker.
  # Run exactly one.
  beat:
    image: ghcr.io/fwdlibraries/stacks/backend:${STACKS_VERSION:-latest}
    build:
      context: ../backend
    command: celery -A app.tasks.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule
    restart: unless-stopped
    healthcheck:
      disable: true
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-stacks}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-stacks}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - stacks

  frontend:
    image: ghcr.io/fwdlibraries/stacks/frontend:${STACKS_VERSION:-latest}
    build:
      context: ../frontend
    restart: unless-stopped
    networks:
      - stacks

  # Z39.50 gateway for app/importers/z3950.py. Opt-in (--profile z3950) because
  # there is no maintained gateway image yet: indexdata/yaz has only a 2015
  # amd64 tag (5.14.10) that current Docker can't pull, and it's the YAZ CLI
  # toolkit, not an HTTP gateway on :8080. Replace this image before enabling.
  yaz:
    image: indexdata/yaz:latest
    profiles: ["z3950"]
    restart: unless-stopped
    networks:
      - stacks

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stacks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-stacks}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stacks}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stacks

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - stacks

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
      - frontend
    networks:
      - stacks

volumes:
  postgres_data:
  redis_data:

networks:
  stacks:
    driver: bridge
