events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    # Note: X-Frame-Options is set per-location to allow LTI iframe embedding
    # from known LMS origins

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=public:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    upstream backend {
        server app:8000;
    }

    upstream frontend_dev {
        server frontend:5173;
    }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # LTI endpoints — allow iframe embedding from LMS origins
        location /lti/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Allow framing for LMS integration
            # TODO: restrict to known LMS origins in production
            add_header X-Frame-Options "ALLOWALL";
        }

        # API — stricter rate limiting
        location /api/v1/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # WebSocket
        location /api/v1/ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        # Public list view — most permissive rate limit, cacheable
        location /public/ {
            limit_req zone=public burst=20 nodelay;
            add_header X-Frame-Options "SAMEORIGIN";
            proxy_pass http://frontend_dev;
            proxy_set_header Host $host;
        }

        # Frontend
        location / {
            add_header X-Frame-Options "SAMEORIGIN";
            proxy_pass http://frontend_dev;
            proxy_set_header Host $host;
        }
    }
}
