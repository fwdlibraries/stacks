# Front door for the dev Cloudflare Tunnel (deploy/docker-compose.dev.yml, profile
# "tunnel"). Serves a production build of the frontend instead of the Vite dev
# server, keeps API docs off the internet, and rate-limits by the visitor's IP.
# Cloudflare terminates TLS, so this listens on plain HTTP inside the Docker network.

limit_req_zone $binary_remote_addr zone=tunnel_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=tunnel_api:10m rate=300r/m;
limit_req_status 429;

server {
    listen 8080;
    server_name _;

    # Only cloudflared can reach this server (it isn't published on the host), so
    # trust the client IP Cloudflare reports; rate limits then apply per visitor
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    # Bulk imports send up to ~1 MB of text
    client_max_body_size 2m;

    # Look containers up per request (Docker's DNS), not once at startup: the app is
    # recreated often in development and comes back with a new address
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app http://app:8000;
    set $frontend http://frontend-static:5173;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    # Rate-limited requests get JSON the app can show ({"detail": ...}), not an nginx page
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"detail": "Too many requests from your network. Wait a minute and try again."}';
    }

    # The API's interactive docs: a map of every endpoint, not needed from outside
    location ~ ^/api/(docs|redoc|openapi\.json) {
        return 404;
    }

    # Sign-in and token exchange: tight per-IP limit (the app also limits per account)
    location /api/v1/auth/ {
        limit_req zone=tunnel_auth burst=5 nodelay;
        proxy_pass $app;
    }

    location /api/ {
        limit_req zone=tunnel_api burst=60 nodelay;
        proxy_pass $app;
    }

    # LTI launches from the LMS (signed by the platform; framing headers come from the app)
    location /lti/ {
        limit_req zone=tunnel_api burst=60 nodelay;
        proxy_pass $app;
    }

    # Hashed build assets: not pages, no frame policy needed
    location /assets/ {
        proxy_pass $frontend;
    }

    # Everything else: the built frontend (editor, student pages, extension connect page).
    # Pages are static, so ask the app which LMS origins may frame them on this
    # hostname (each organization has its own) and send that policy.
    location / {
        auth_request /_frame-policy;
        auth_request_set $frame_policy $upstream_http_content_security_policy;
        add_header Content-Security-Policy $frame_policy always;
        add_header X-Content-Type-Options nosniff always;
        proxy_pass $frontend;
    }

    location = /_frame-policy {
        internal;
        proxy_pass $app/api/v1/tenant/frame-policy;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }
}
