# Development overrides — mount source for hot reload
# Usage (from repo root):
#   docker compose --env-file .env -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml up

services:
  app:
    build:
      context: ../backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../backend:/app
    environment:
      DEBUG: "true"
    ports:
      - "8000:8000"

  worker:
    volumes:
      - ../backend:/app
    environment:
      DEBUG: "true"

  frontend:
    build:
      context: ../frontend
    command: npm run dev -- --host
    volumes:
      - ../frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"

  db:
    ports:
      - "5432:5432"  # expose for local DB tools (TablePlus, pgAdmin, etc.)

  redis:
    ports:
      - "6379:6379"
