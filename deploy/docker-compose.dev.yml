# Development overrides — mount source for hot reload
# Usage (from repo root):
#   docker compose --env-file .env -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml up

services:
  app:
    build:
      context: ../backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../backend:/app
    environment:
      DEBUG: "true"
    ports:
      - "${API_HOST_PORT:-8000}:8000"

  worker:
    volumes:
      - ../backend:/app
    environment:
      DEBUG: "true"

  beat:
    volumes:
      - ../backend:/app

  frontend:
    build:
      context: ../frontend
      target: dev
    command: npm run dev -- --host
    environment:
      VITE_API_PROXY_TARGET: http://app:8000
    volumes:
      - ../frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"

  db:
    ports:
      - "${DB_HOST_PORT:-5432}:5432"  # expose for local DB tools (TablePlus, pgAdmin, etc.)

  redis:
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"

  # The TLS edge proxy isn't needed in dev (Vite proxies /api and /lti) and
  # can't start without deploy/nginx/certs/. Opt in with --profile proxy.
  nginx:
    profiles: ["proxy"]

  # Cloudflare Tunnel: serves the dev stack at a fixed public hostname, for testing
  # LTI launches from a real LMS and the browser extension. Opt-in (profile "tunnel"):
  #   1. Create a tunnel in Cloudflare Zero Trust (Networks → Tunnels). Give it a
  #      public hostname whose service is HTTP, URL tunnel-proxy:8080
  #   2. Put its token in .env as CLOUDFLARE_TUNNEL_TOKEN, and the hostname in
  #      PUBLIC_BASE_URL (https://…)
  #   3. docker compose ... --profile tunnel up -d --build
  # The tunnel serves a production build (frontend-static), not the Vite dev
  # server; rebuild it to see frontend changes there: up -d --build frontend-static
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      # Read from the environment, so the token never appears in `ps` or compose output
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - tunnel-proxy
    restart: unless-stopped
    networks:
      - stacks

  # The tunnel's front door: routing, rate limits, no API docs (deploy/nginx/tunnel.conf)
  tunnel-proxy:
    image: nginx:1.27-alpine
    profiles: ["tunnel"]
    volumes:
      - ./nginx/tunnel.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - frontend-static
    restart: unless-stopped
    networks:
      - stacks

  # Production build of the frontend, for the tunnel
  frontend-static:
    build:
      context: ../frontend
      target: prod
    profiles: ["tunnel"]
    restart: unless-stopped
    networks:
      - stacks
