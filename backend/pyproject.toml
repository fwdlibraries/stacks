[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stacks"
version = "0.1.0"
description = "Open-source course reading list and citation management platform"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"

dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",

    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",

    # Auth & Security
    "passlib[bcrypt]>=1.7",
    "PyJWT[crypto]>=2.8",  # [crypto]: RS256 for LTI id_tokens
    "python-multipart>=0.0.12",

    # Redis
    "redis>=5.2",

    # Task queue
    "celery[redis]>=5.4",

    # HTTP client
    "httpx>=0.27",

    # Z39.50 / MARC parsing
    "pymarc>=5.1",

    # AWS / S3
    "boto3>=1.35",

    # Email
    "aiosmtplib>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",   # line length: not enforced
    "UP042",  # (str, Enum) → StrEnum changes str() output; not a pure style fix
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom: calls in argument defaults are intended
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Path", "fastapi.Form"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
